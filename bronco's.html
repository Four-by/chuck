<!DOCTYPE html> 
<html lang="en"> 
<head>     
    <meta charset="UTF-8">     
    <meta name="viewport" content="width=device-width, initial-scale=1.0">     
    <title>3D Wheel Menu</title>     
    <style>     
    body {         
        margin: 0;         
        padding: 0;         
        /* Atmospheric dark garage picture background */
        background-image: url('https://thumbs.dreamstime.com/b/modern-dark-garage-sleek-cabinets-blue-led-floor-lighting-clean-workspace-has-multiple-sinks-ample-storage-tools-408824928.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        display: flex;         
        justify-content: left;         
        align-items: left;         
        height: 100vh;         
        overflow: hidden;         
        user-select: none;     
    }      
      
    .applet-container {         
        width: 400px;         
        height: 500px;         
        position: relative;         
        perspective: 1200px;         
        perspective-origin: 50% 50%;         
        display: flex;         
        justify-content: center;         
        align-items: center;     
    }      

    .wheel-hub {         
        position: relative;         
        width: 130px;          
        height: 150px;         
        transform-style: preserve-3d;         
        will-change: transform;         
        transition: transform 0.15s ease-out;     
    }      

    .license-plate {         
        position: absolute;         
        width: 100%;                           
        height: 100%;                          
        top: 0;         
        left: 0;         
        background-color: #172A45; /* Dark slate blue plates */         
        border: 3px solid #000000;         
        box-shadow: inset 0 0 10px rgba(0,0,0,0.5), 0 0 15px rgba(100, 255, 218, 0.15);         
        color: #64FFDA; /* Bright ice/cyan blue text for sharp contrast */         
        font-weight: bold;         
        font-size: 32px;         
        text-decoration: none;         
        display: flex;         
        justify-content: center;         
        align-items: center;         
        flex-wrap: wrap;         
        text-align: center;         
        word-break: break-word;         
        cursor: pointer;         
        backface-visibility: visible;         
        transition: background-color 0.2s, color 0.2s, text-shadow 0.2s;         
        letter-spacing: 1px;         
        z-index: 5;         
        text-shadow: 1px 1px 0px #000, 2px 2px 0px #001220, 3px 3px 5px rgba(0,0,0,0.8);     
    }      

    .license-plate:hover {         
        background-color: #3066BE; /* Royal blue background on hover */         
        color: #FFFFFF; /* Clean white text when selected */         
        text-shadow: 1px 1px 0px #000, 2px 2px 3px #0A192F, 3px 3px 6px rgba(0,0,0,0.9);     
    }      

    .wheel-cap {         
        position: absolute;         
        width: 260px;         
        height: 260px;         
        top: 50%;         
        left: 50%;         
        margin-top: -130px;         
        margin-left: -130px;         
        border-radius: 50%;         
        border: 5px solid #001220;         
        box-shadow: 0 0 15px rgba(0,0,0,0.5);         
        background: radial-gradient(circle at center, #64FFDA 0%, #172A45 15%, #0A192F 16%, transparent 26%),                     
                    repeating-conic-gradient(from 0deg, #112240 0deg 20deg, #3066BE 20deg 25deg, #0A192F 25deg 27deg);         
        backface-visibility: visible;         
        pointer-events: none;         
        z-index: 1;     
    }      

    .cap-left {         
        transform: rotateY(90deg) translateZ(-65px);     
    }     
    .cap-right {         
        transform: rotateY(90deg) translateZ(65px);     
    } 
    </style> 
	
  
</HEAD>

<body>    

    <div class="applet-container" id="stage">         
        <div class="wheel-hub" id="hub">             
            <div class="wheel-cap cap-left"></div>             
            <div class="wheel-cap cap-right"></div>             
            <a href="1stb2.html" class="license-plate" target="_top">1st Bronco ll</a>             
            <a href="BlueBronco ll.html" class="license-plate" target="_top">2nd Bronco ll</a>             
            <a href="3rdb2.html" class="license-plate" target="_top">3rd Bronco ll</a>             
            <a href="4thb2.html" class="license-plate" target="_top">4th Bronco ll</a>             
            <a href="Bronco II's.html" class="license-plate" target="_top">5th Bronco ll</a>             
            <a href="bronco.html" class="license-plate" target="_top">1967 Bronco</a>         
        </div>     
    </div>      
	
	<div id="wheel-image-container" style="margin: 20px auto; text-align: center; min-height: 300px;">
    <img id="wheel-picture" src="" alt="" style="max-width: 100%; max-height: 400px; display: none; border: 3px solid #fff; box-shadow: 0px 0px 15px rgba(0,0,0,0.5);">
</div>

    <script>         
        const stage = document.getElementById('stage');         
        const hub = document.getElementById('hub');         
        const plates = document.querySelectorAll('.license-plate');         
        const totalPlates = plates.length;         
        const radius = 130;         
        let currentRotation = 0;         
        let sideTilt = 0;         
        const baseSpeed = 0.75;         
        let targetSpeed = baseSpeed;         
        let isDragging = false;         
        let isHovered = false;         
        let startY = 0;          

        function layoutWheel() {             
            plates.forEach((plate, index) => {                 
                const angle = (360 / totalPlates) * index;                 
                plate.style.transform = `rotateX(${angle}deg) translateZ(${radius}px)`;             
            });         
        }          

        function updateRotation() {             
            if (!isDragging && !isHovered) {                 
                currentRotation += targetSpeed;             
            }             
            hub.style.transform = `rotateY(${sideTilt}deg) rotateX(${-currentRotation}deg)`;             
            requestAnimationFrame(updateRotation);         
        }          

        stage.addEventListener('mousemove', (e) => {             
            if (e.target.classList.contains('license-plate') || e.target.closest('.license-plate')) {                 
                isHovered = true;             } else {                 
                isHovered = false;             }             
            const rect = stage.getBoundingClientRect();             
            const containerCenterX = rect.left + (rect.width / 2);             
            const containerCenterY = rect.top + (rect.height / 2);             
            const deltaX = (e.clientX - containerCenterX) / (rect.width / 2);             
            sideTilt = deltaX * 55;              
            if (e.clientY > containerCenterY) {                 
                targetSpeed = -baseSpeed;             } else {                 
                targetSpeed = baseSpeed;             }              
            if (!isDragging) return;             
            const deltaY = e.clientY - startY;             
            currentRotation += deltaY * 0.4;             
            startY = e.clientY;         
        });          

        stage.addEventListener('mouseleave', () => {             
            sideTilt = 0;             
            targetSpeed = baseSpeed;             
            isHovered = false;         
        });          

        window.addEventListener('mousedown', (e) => {             
            if (!stage.contains(e.target)) return;             
            isDragging = true;             
            startY = e.clientY;         
        });          

        window.addEventListener('mouseup', () => {             
            isDragging = false;         
        });          

        layoutWheel();         
        updateRotation();     
    </script> 

</div>
<div style="text-align: left; margin: 100px 700px 80px 10px;">
    <img id="bronco-pic" img src="1988b21.jpg" alt="B2" class="bronco-img" width="576" height="432">
</div>

<script>
        // List your different image filenames here:
        var images = ['1988b21.jpg', 'bronc.jpg', 'bllai.jpg', 'bbrll1.jpg', 'bluebii.jpg', 'bronco.jpg'];
        
        // Pick one at random when the page opens:
        var randomImage = images[Math.floor(Math.random() * images.length)];
        
        // Swap the image on the screen safely:
        document.getElementById('bronco-pic').src = randomImage;
    </script>
</body> </html>
