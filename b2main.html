<html lang="en"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>B2 Main</title>    <style>        /* Force the background to spread across 100% of the screen window */        html, body {            margin: 0;            padding: 0;            min-height: 100vh;            width: 100%;        }        body {                     /* HERE IS YOUR BACKGROUND IMAGE RULES */            background-image: url('background.jpg');            background-size: cover;            background-position: center;            background-repeat: no-repeat;            background-attachment: fixed;            /* Clean structural alignment centering layout */            display: grid;            grid-template-rows: 1fr auto;            justify-items: center;            align-items: center;            user-select: none;             }        /* Centers your custom Bronco photo box perfectly on the wallpaper grid */        .bronco-image-box {            text-align: center;             margin: 40px auto;         }        .bronco-img {            display: inline-block;            border: 3px solid #fff;            box-shadow: 0px 0px 15px rgba(0,0,0,0.5);        }        /* Spaces your isolated navigation button directly at the bottom center */        footer {            padding: 30px;            width: 100%;            text-align: center;        }        footer a {            color: #64FFDA; /* Ice/cyan blue text contrast */            text-decoration: none;            font-weight: bold;            font-size: 24px;            font-family: sans-serif;            text-shadow: 2px 2px 4px #000;        }        footer a:hover {            text-decoration: underline;            color: #ffffff;        }    </style></head><body>    <!-- Centered Bronco Image Content Box -->    <div class="bronco-image-box">        <img id="bronco-pic" src="1988b21.jpg" alt="B2" class="bronco-img" width="576" height="432">    </div>    <!-- Pinned Home Navigation Bar Link -->    <footer>        <p><center><font size="+2"><a href="index.html" target="_top">Home</a></font></center></p>    </footer>    <!-- Picture Randomizer Script Logic -->    <script>        var images = ['1988b21.jpg', 'bronc.jpg', 'bllai.jpg', 'bbrll1.jpg', 'bluebii.jpg', 'bronco.jpg'];        var randomImage = images[Math.floor(Math.random() * images.length)];        document.getElementById('bronco-pic').src = randomImage;    </script></body></html>
