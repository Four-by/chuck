<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Video Frame</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000; /* Optional: gives a black background like a theater */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Keeps the video proportional inside the frame */
        }
    </style>
</head>
<body>

    <!-- Replace 'your-video.mp4' with your actual video file name -->
    <video controls>
        <source src="Briarwood.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

</body>
</html>
