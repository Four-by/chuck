<!DOCTYPE html>
<html lang="en">
<head>
    <title>Framset Layout</title>
</head>

<frameset cols="375,*">
    <!-- This nests a row split inside the left 375px column -->
    <!-- The menu gets 80% of the height, leaving 20% at the bottom -->
    <frameset rows="20%,20%">
        <frame src="menu1.html" name="menu" scrolling="yes">
      
        <frame src="randyandcandkandd1.jpg" name="t_bottom" noresize>
	</frameset>
    
    <!-- This is your original right column -->
    <frame src="main2.html" name="content" noresize scrolling="yes">
</frameset>

</html>
